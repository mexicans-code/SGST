<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGST</title>
  <script>
    (function () {
      var parts = decodeURIComponent(window.location.pathname).split('/').filter(Boolean);
      var repo = parts[0] || '';
      var rest = parts.slice(1).join('/');
      var base = repo ? '/' + repo : '';
      window.location.replace(base + '/index.html' + (rest ? '#/' + rest : ''));
    })();
  </script>
</head>
<body></body>
</html>
